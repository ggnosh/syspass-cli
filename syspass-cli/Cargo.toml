[package]
name = "syspass-cli"
version = "0.8.0"
edition = "2024"
description = "A CLI client for Syspass"
repository = "https://github.com/ggnosh/syspass-cli"
homepage = "https://github.com/ggnosh/syspass-cli"
keywords = ["syspass", "cli"]
license = "MIT"
readme = "../README.md"
authors = ["GGnosh"]
categories = ["command-line-utilities"]
exclude = [
    "tests",
    "report.json",
    "coverage",
    "resources"
]

[lints]
workspace = true

[dependencies]
arboard = { version = "3.4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["cargo", "wrap_help", "color", "suggestions"] }
clap_complete = { version = "4.5", features = ["default"] }
home = { version = "0.5" }
log = { version = "0.4", features = ["release_max_level_error"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
shellexpand = "3.1"
term-table = "1.3"
terminal_size = "0.4"
version-compare = "0.2"
dialoguer = { version = "0.11", features = ["fuzzy-select", "password"] }
miette = { version = "7.5" }
thiserror = "2.0"
owo-colors = { version = "4.2", features = ["supports-colors"] }
itertools = "0.14"
rand = "0.9"
mockall = "0.13.1"

[dev-dependencies]
assert_cmd = "2.0"
mockito = { version = "1.2", features = [] }
predicates = "3.0"
test-case = "3.2"
regex = "1.9"
tempfile = "3.14"
